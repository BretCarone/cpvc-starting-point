<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Stats & History Hub (2000 - Present)</title>
    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --accent-blue: #0284c7;
            --accent-red: #dc2626;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --gold: #eab308;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header & Navigation */
        header {
            background-color: #090d16;
            border-bottom: 2px solid var(--accent-red);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-main);
        }

        .logo-badge {
            background: linear-gradient(135deg, var(--accent-red), var(--accent-blue));
            color: white;
            font-weight: 900;
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            letter-spacing: 1px;
            font-size: 1.2rem;
            box-shadow: 0 2px 8px rgba(220, 38, 38, 0.4);
        }

        .logo-text {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .logo-text span {
            color: var(--accent-blue);
        }

        /* Controls / Filters */
        .controls-bar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background-color: var(--bg-card);
            padding: 0.4rem 0.75rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .control-group label {
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-muted);
        }

        select, input {
            background: transparent;
            color: var(--text-main);
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        select option {
            background-color: #1e293b;
            color: #f8fafc;
            padding: 8px;
        }

        .search-box {
            position: relative;
            flex-grow: 1;
            max-width: 280px;
        }

        .search-box input {
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 0.5rem 0.75rem 0.5rem 2.2rem;
            border-radius: 8px;
            font-size: 0.9rem;
            color: var(--text-main);
            transition: all 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.3);
        }

        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        /* Tab Bar Navigation */
        .category-tabs {
            background-color: #0f172a;
            border-bottom: 1px solid var(--border-color);
            padding: 0 1.5rem;
        }

        .tabs-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            scrollbar-width: thin;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 0.85rem 1.25rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            white-space: nowrap;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .tab-btn:hover {
            color: var(--text-main);
            background-color: rgba(255,255,255,0.03);
        }

        .tab-btn.active {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
        }

        /* Scoreboard Ticker */
        .ticker-wrap {
            background-color: #070a12;
            border-bottom: 1px solid var(--border-color);
            padding: 0.5rem 0;
            overflow: hidden;
        }

        .ticker-container {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            padding: 0 1.5rem;
            scrollbar-width: none;
        }

        .ticker-container::-webkit-scrollbar {
            display: none;
        }

        .ticker-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.4rem 0.8rem;
            min-width: 160px;
            flex-shrink: 0;
            font-size: 0.8rem;
        }

        .ticker-team {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0.1rem 0;
        }

        .ticker-team img {
            width: 16px;
            height: 16px;
            margin-right: 0.4rem;
        }

        .ticker-team-name {
            display: flex;
            align-items: center;
            font-weight: 600;
        }

        .ticker-score {
            font-weight: 700;
        }

        .ticker-status {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: right;
            margin-top: 0.2rem;
            text-transform: uppercase;
        }

        /* Main Layout */
        main {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem;
            flex-grow: 1;
        }

        /* Leaderboard Table Styles */
        .stats-section-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .stats-title {
            font-size: 1.5rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .stats-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .table-container {
            background-color: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background-color: #162032;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
        }

        th:hover {
            color: var(--text-main);
        }

        th.sort-active {
            color: var(--accent-blue);
        }

        td {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            white-space: nowrap;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: var(--bg-hover);
        }

        .rank-cell {
            font-weight: 700;
            color: var(--text-muted);
            width: 40px;
            text-align: center;
        }

        .top-3-rank {
            color: var(--gold);
        }

        .player-cell {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-weight: 600;
        }

        .player-headshot {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #090d16;
            border: 1px solid var(--border-color);
        }

        .player-info-text {
            display: flex;
            flex-direction: column;
        }

        .player-name {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
        }

        .player-name:hover {
            color: var(--accent-blue);
            text-decoration: underline;
        }

        .team-logo {
            width: 20px;
            height: 20px;
            vertical-align: middle;
            margin-right: 0.4rem;
        }

        .stat-highlight {
            font-weight: 800;
            color: var(--text-main);
        }

        /* Modal Player Profile */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 90%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(0,0,0,0.5);
            border: none;
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .modal-close:hover {
            background: var(--accent-red);
        }

        .profile-header {
            background: linear-gradient(180deg, #090d16 0%, var(--bg-card) 100%);
            padding: 2rem;
            display: flex;
            gap: 2rem;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .profile-headshot {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid var(--accent-blue);
            object-fit: cover;
            background-color: #0f172a;
        }

        .profile-details h2 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.2rem;
        }

        .profile-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .meta-tag {
            background: rgba(255,255,255,0.05);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-weight: 600;
        }

        .profile-summary-stats {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .stat-badge {
            display: flex;
            flex-direction: column;
        }

        .stat-badge .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 700;
        }

        .stat-badge .value {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--accent-blue);
        }

        .profile-body {
            padding: 2rem;
        }

        .profile-section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        /* Loading & Error States */
        .loading-spinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem;
            gap: 1rem;
            color: var(--text-muted);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .header-container {
                flex-direction: column;
                align-items: stretch;
            }
            .controls-bar {
                justify-content: space-between;
            }
            .search-box {
                max-width: 100%;
            }
            .profile-header {
                flex-direction: column;
                text-align: center;
            }
            .profile-meta, .profile-summary-stats {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Header Bar -->
    <header>
        <div class="header-container">
            <a href="#" class="logo-section">
                <div class="logo-badge">NFL</div>
                <div class="logo-text">Stats <span>Hub</span></div>
            </a>

            <div class="controls-bar">
                <!-- Season Selector -->
                <div class="control-group">
                    <label for="seasonSelect">Season</label>
                    <select id="seasonSelect"></select>
                </div>

                <!-- Season Type -->
                <div class="control-group">
                    <label for="seasonTypeSelect">Type</label>
                    <select id="seasonTypeSelect">
                        <option value="2">Regular Season</option>
                        <option value="3">Postseason</option>
                    </select>
                </div>

                <!-- Live Search Box -->
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="Filter by player or team...">
                </div>
            </div>
        </div>
    </header>

    <!-- Scoreboard Live Ticker -->
    <div class="ticker-wrap">
        <div class="ticker-container" id="tickerContainer">
            <div style="font-size: 0.8rem; color: var(--text-muted); padding: 0.2rem;">Loading scores...</div>
        </div>
    </div>

    <!-- Category Tabs -->
    <nav class="category-tabs">
        <div class="tabs-container">
            <button class="tab-btn active" data-category="passing">🏈 Passing</button>
            <button class="tab-btn" data-category="rushing">🏃 Rushing</button>
            <button class="tab-btn" data-category="receiving">👐 Receiving</button>
            <button class="tab-btn" data-category="defensive">🛡️ Defense</button>
            <button class="tab-btn" data-category="kicking">👟 Kicking</button>
            <button class="tab-btn" data-category="punting">🦵 Punting</button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main>
        <div class="stats-section-header">
            <div>
                <div style="display:flex; align-items:center; gap:0.75rem; flex-wrap:wrap;">
                    <h1 class="stats-title" id="displayTitle">Passing Leaders</h1>
                    <span id="dataSourceBadge" style="font-size:0.75rem; padding:0.2rem 0.6rem; border-radius:12px; background:rgba(2, 132, 199, 0.2); color:var(--accent-blue); font-weight:600; border:1px solid var(--accent-blue);">⚡ Live ESPN API</span>
                </div>
                <div class="stats-subtitle" id="displaySubtitle">Showing top 32 statistical performers</div>
            </div>
            <div id="resultCount" style="font-size:0.85rem; color: var(--text-muted); font-weight:600;">32 Players</div>
        </div>

        <div id="statsTableWrapper">
            <!-- Table dynamically injected here -->
        </div>
    </main>

    <!-- Player Profile Modal -->
    <div class="modal-overlay" id="playerModal">
        <div class="modal-card">
            <button class="modal-close" id="modalCloseBtn">&times;</button>
            <div id="modalContent">
                <!-- Profile loaded dynamically -->
            </div>
        </div>
    </div>

    <script>
        // Global App State
        const state = {
            season: 2024,
            seasonType: 2, // Regular Season = 2, Postseason = 3
            category: 'passing',
            searchTerm: '',
            rawData: [],
            sortColumn: '',
            sortAscending: false,
            limit: 32
        };

        // Category & Column Definitions
        const statSchemas = {
            passing: {
                title: 'Passing Leaders',
                sourceCategory: 'passing',
                sortField: 'passingYards',
                columns: [

            receiving: {

            defensive: {

                    { id: 'interceptions', label: 'INT', desc: 'Interceptions', align: 'right', highlight: true },

            kicking: {

            punting: {

                    { id: 'puntsInside20', label: 'i20', desc: 'Punts Inside 20 Yard Line', align: 'right' }

        // Era Database with authentic Top 32 player rosters for each period
        const historicalRostersByEra = {
            // 2000 - 2005 Era
            era2000: {
                passing: [
                    { name: 'Peyton Manning', team: 'IND', pos: 'QB', id: '1428', yds: 4413, td: 33, int: 15, rating: 98.8 },

            cacheDOMElements();
            populateSeasonOptions();
            setupEventListeners();
            fetchLiveScores();

        function populateSeasonOptions() {
            if (!seasonSelect) return;
            seasonSelect.innerHTML = '';
            for (let year = 2026; year >= 2000; year--) {
                const opt = document.createElement('option');
                opt.value = year;
                opt.textContent = `${year} Season`;
                if (year === state.season) opt.selected = true;
                seasonSelect.appendChild(opt);
            }
        }

        function setupEventListeners() {
            seasonSelect.addEventListener('change', (e) => {
                state.season = parseInt(e.target.value);
                loadLeaderboardData();
            });

            seasonTypeSelect.addEventListener('change', (e) => {
                state.seasonType = parseInt(e.target.value);
                loadLeaderboardData();
            });

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    e.currentTarget.classList.add('active');
                    state.category = e.currentTarget.dataset.category;
                    state.sortColumn = '';
                    loadLeaderboardData();
                });
            });

            searchInput.addEventListener('input', (e) => {
                state.searchTerm = e.target.value.toLowerCase();
                renderTable();
            });

            modalCloseBtn.addEventListener('click', closeModal);
            playerModal.addEventListener('click', (e) => {
                if (e.target === playerModal) closeModal();
            });
        }

        async function fetchWithRetry(url, retries = 2, delay = 400) {
            let lastError;
            for (let i = 0; i <= retries; i++) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`ESPN returned HTTP ${response.status}`);
                    return await response.json();
                } catch (err) {
                    lastError = err;
                    if (i === retries) break;
                    await new Promise(res => setTimeout(res, delay));
                }
            }
            throw lastError || new Error('Unable to reach ESPN');
        }

                return {
                    id: p.id,
                    name: p.name,
                    headshot: `https://a.espncdn.com/i/headshots/nfl/players/full/${p.id}.png`,
                    position: p.pos,
                    team: p.team,
                    teamLogo: `https://a.espncdn.com/i/teamlogos/nfl/500/${p.team.toLowerCase()}.png`,
                    stats: stats
                };
            });
        }

        // Fetch Live Scores for Ticker
        async function fetchLiveScores() {
            if (!tickerContainer) return;
            try {
                const data = await fetchWithRetry('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard');
                if (data && data.events && data.events.length > 0) {
                    tickerContainer.innerHTML = data.events.map(event => {
                        const comp = event.competitions[0];
                        const home = comp.competitors.find(c => c.homeAway === 'home');
                        const away = comp.competitors.find(c => c.homeAway === 'away');
                        const status = event.status.type.shortDetail;

                        return `
                            <div class="ticker-card">
                                <div class="ticker-team">
                                    <div class="ticker-team-name">
                                        <img src="${away.team.logo || ''}" alt="" onerror="this.style.display='none'">
                                        ${away.team.abbreviation}
                                    </div>
                                    <div class="ticker-score">${away.score || '0'}</div>
                                </div>
                                <div class="ticker-team">
                                    <div class="ticker-team-name">
                                        <img src="${home.team.logo || ''}" alt="" onerror="this.style.display='none'">
                                        ${home.team.abbreviation}
                                    </div>
                                    <div class="ticker-score">${home.score || '0'}</div>
                                </div>
                                <div class="ticker-status">${status}</div>
                            </div>
                        `;
                    }).join('');
                    return;
                }
            } catch (error) {
                // Ignore score fetch error
            }

            tickerContainer.innerHTML = `
                <div class="ticker-card" style="min-width:260px; color:var(--text-muted);">
                    Live scores are temporarily unavailable.
                </div>`;
        }

        let leaderboardRequestId = 0;
        const responseCache = new Map();

        function secureESPNUrl(url) {
            return url ? url.replace(/^http:\/\//, 'https://') : '';
        }

        async function fetchCached(url) {
            const safeUrl = secureESPNUrl(url);
            if (!responseCache.has(safeUrl)) {
                responseCache.set(safeUrl, fetchWithRetry(safeUrl).catch(error => {
                    responseCache.delete(safeUrl);
                    throw error;
                }));
            }
            return responseCache.get(safeUrl);
        }

        async function mapWithConcurrency(items, concurrency, mapper) {
            const results = new Array(items.length);
            let nextIndex = 0;
            async function worker() {
                while (nextIndex < items.length) {
                    const index = nextIndex++;
                    results[index] = await mapper(items[index], index);
                }
            }
            await Promise.all(Array.from({ length: Math.min(concurrency, items.length) }, worker));
            return results;
        }

        // Load real, season-specific ESPN statistics.
        async function loadLeaderboardData() {
            const requestId = ++leaderboardRequestId;
            const schema = statSchemas[state.category];
            displayTitle.innerText = `${state.season} ${schema.title}`;
            displaySubtitle.innerText = `Showing top 32 statistical performers (${state.seasonType === 2 ? 'Regular Season' : 'Postseason'})`;

            statsTableWrapper.innerHTML = `
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <div>Fetching ${state.season} statistics...</div>
                </div>
            `;

            try {
                const sort = `${schema.sourceCategory}:${schema.sortField}:desc`;
                const url = `https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/seasons/${state.season}/types/${state.seasonType}/statistics/0/byathlete?limit=${state.limit}&page=1&sort=${encodeURIComponent(sort)}&lang=en&region=us`;
                const json = await fetchWithRetry(url);
                if (!Array.isArray(json.items)) throw new Error('ESPN returned an unexpected response');

                const parsed = await parseESPNStatistics(json.items, schema);
                if (requestId !== leaderboardRequestId) return;

                state.rawData = parsed;
                dataSourceBadge.innerHTML = '⚡ Live ESPN API';
                dataSourceBadge.style.background = 'rgba(2, 132, 199, 0.2)';
                dataSourceBadge.style.borderColor = 'var(--accent-blue)';
                dataSourceBadge.style.color = 'var(--accent-blue)';
                renderTable();
            } catch (err) {
                if (requestId !== leaderboardRequestId) return;
                state.rawData = [];
                dataSourceBadge.innerHTML = 'ESPN unavailable';
                dataSourceBadge.style.background = 'rgba(220, 38, 38, 0.15)';
                dataSourceBadge.style.borderColor = 'var(--accent-red)';
                dataSourceBadge.style.color = '#f87171';
                resultCount.innerText = '0 Players';
                statsTableWrapper.innerHTML = `
                    <div style="text-align:center; padding:3rem; color:var(--text-muted);">
                        <div style="color:var(--text-main); font-weight:700; margin-bottom:0.5rem;">Could not load ESPN statistics</div>
                        <div>${err.message || 'The ESPN data service did not respond.'}</div>
                        <button onclick="loadLeaderboardData()" style="margin-top:1rem; padding:0.6rem 1rem; border:1px solid var(--accent-blue); border-radius:6px; color:var(--text-main); background:var(--bg-card); cursor:pointer;">Try again</button>
                    </div>`;
            }
        }

        // Each statistics item contains all of the player's real values, but ESPN
        // exposes the name/position/team through references that must be hydrated.
        async function parseESPNStatistics(items, schema) {
            return mapWithConcurrency(items, 8, async item => {
                const athlete = await fetchCached(item.athlete?.$ref);
                const team = athlete.team?.$ref ? await fetchCached(athlete.team.$ref) : null;
                const categoryStats = {};

                (item.splits?.categories || []).forEach(category => {
                    categoryStats[category.name] = Object.fromEntries(
                        (category.stats || []).map(stat => [stat.name, stat.value ?? stat.displayValue])
                    );
                });

                const stats = {};
                schema.columns.forEach(column => {
                    let sourceCategory = schema.sourceCategory;
                    if (state.category === 'defensive' && column.id === 'interceptions') sourceCategory = 'defensiveInterceptions';
                    if (state.category === 'defensive' && ['forcedFumbles', 'fumbleRecoveries'].includes(column.id)) sourceCategory = 'general';
                    const sourceName = column.id === 'forcedFumbles' ? 'fumblesForced'
                        : column.id === 'fumbleRecoveries' ? 'fumblesRecovered'
                        : column.id;
                    stats[column.id] = categoryStats[sourceCategory]?.[sourceName];
                });

                const id = String(athlete.id || item.athlete?.$ref?.match(/athletes\/(\d+)/)?.[1] || '');
                const abbreviation = team?.abbreviation || 'FA';
                const logo = team?.logos?.find(logo => logo.rel?.includes('default'))?.href
                    || `https://a.espncdn.com/i/teamlogos/nfl/500/${abbreviation.toLowerCase()}.png`;

                return {
                    id,
                    name: athlete.displayName || athlete.fullName || 'NFL Athlete',
                    headshot: athlete.headshot?.href || `https://a.espncdn.com/i/headshots/nfl/players/full/${id}.png`,
                    position: athlete.position?.abbreviation || 'N/A',
                    team: abbreviation,
                    teamLogo: logo,
                    stats
                };
            });
        }

        // Render Leaderboard Table
        function renderTable() {
            const schema = statSchemas[state.category];
            let filtered = [...state.rawData];

            if (state.searchTerm) {
                filtered = filtered.filter(item => 
                    item.name.toLowerCase().includes(state.searchTerm) ||
                    item.team.toLowerCase().includes(state.searchTerm) ||
                    item.position.toLowerCase().includes(state.searchTerm)
                );
            }

            const primaryStat = schema.columns[0].id;
            const activeSortCol = state.sortColumn || primaryStat;

            filtered.sort((a, b) => {
                let valA = a.stats[activeSortCol] ?? 0;
                let valB = b.stats[activeSortCol] ?? 0;

                if (typeof valA === 'string') valA = parseFloat(valA) || 0;
                if (typeof valB === 'string') valB = parseFloat(valB) || 0;

                return state.sortAscending ? valA - valB : valB - valA;
            });

            const displayList = filtered.slice(0, state.limit);
            resultCount.innerText = `${displayList.length} Players`;

            if (displayList.length === 0) {
                statsTableWrapper.innerHTML = `
                    <div style="text-align:center; padding:3rem; color:var(--text-muted);">
                        No matching players found for "${state.searchTerm}".
                    </div>
                `;
                return;
            }

            let tableHtml = `
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th class="rank-cell">RK</th>
                                <th>PLAYER</th>
                                <th>POS</th>
                                <th>TEAM</th>
            `;

            schema.columns.forEach(col => {
                const isSorted = col.id === activeSortCol;
                const arrow = isSorted ? (state.sortAscending ? ' ▲' : ' ▼') : '';
                tableHtml += `<th class="${isSorted ? 'sort-active' : ''}" style="text-align:${col.align};" onclick="sortTable('${col.id}')" title="${col.desc}">${col.label}${arrow}</th>`;
            });

            tableHtml += `
                            </tr>
                        </thead>
                        <tbody>
            `;

            displayList.forEach((player, index) => {
                const rank = index + 1;
                const rankClass = rank <= 3 ? 'top-3-rank' : '';

                tableHtml += `
                    <tr>
                        <td class="rank-cell ${rankClass}">${rank}</td>
                        <td>
                            <div class="player-cell">
                                <img class="player-headshot" src="${player.headshot}" alt="${player.name}" onerror="this.src='https://a.espncdn.com/combos/i/headshots/nfl/num/1.png'">
                                <div class="player-info-text">
                                    <span class="player-name" onclick="openPlayerProfile('${player.id}')">${player.name}</span>
                                </div>
                            </div>
                        </td>
                        <td><span style="font-weight:600; color:var(--text-muted);">${player.position}</span></td>
                        <td>
                            <div style="display:flex; align-items:center;">
                                <img class="team-logo" src="${player.teamLogo}" alt="" onerror="this.style.display='none'">
                                <span style="font-weight:700;">${player.team}</span>
                            </div>
                        </td>
                `;

                schema.columns.forEach(col => {
                    let rawVal = player.stats[col.id];
                    let displayVal = '-';

                    if (rawVal !== undefined && rawVal !== null) {
                        if (typeof rawVal === 'number') {
                            displayVal = Number.isInteger(rawVal) ? rawVal.toLocaleString() : rawVal.toFixed(1);
                        } else {
                            displayVal = rawVal;
                        }
                    }

                    const isHighlight = col.highlight ? 'stat-highlight' : '';
                    tableHtml += `<td class="${isHighlight}" style="text-align:${col.align};">${displayVal}</td>`;
                });

                tableHtml += `</tr>`;
            });

            tableHtml += `
                        </tbody>
                    </table>
                </div>
            `;

            statsTableWrapper.innerHTML = tableHtml;
        }

        window.sortTable = function(columnId) {
            if (state.sortColumn === columnId) {
                state.sortAscending = !state.sortAscending;
            } else {
                state.sortColumn = columnId;
                state.sortAscending = false;
            }
            renderTable();
        };

        // Open Player Profile Modal
        window.openPlayerProfile = async function(playerId) {
            playerModal.classList.add('active');
            modalContent.innerHTML = `
                <div class="loading-spinner" style="padding: 5rem;">
                    <div class="spinner"></div>
                    <div>Loading career profile statistics...</div>
                </div>
            `;

            const localPlayer = state.rawData.find(p => p.id === playerId) || {
                name: 'NFL Athlete',
                position: 'QB',
                team: 'NFL',
                id: playerId
            };

            try {
                const bioUrl = `https://site.web.api.espn.com/apis/common/v3/sports/football/nfl/athletes/${playerId}`;
                const bioData = await fetchWithRetry(bioUrl);
                const statsUrl = `https://site.web.api.espn.com/apis/common/v3/sports/football/nfl/athletes/${playerId}/overview`;
                const overviewData = await fetchWithRetry(statsUrl);

                renderPlayerModal(bioData, overviewData);
            } catch (err) {
                const fallbackBio = {
                    athlete: {
                        id: playerId,
                        displayName: localPlayer.name,
                        position: { displayName: localPlayer.position },
                        team: { displayName: localPlayer.team },
                        headshot: { href: localPlayer.headshot }
                    }
                };
                renderPlayerModal(fallbackBio, null);
            }
        };

        function renderPlayerModal(bio, overview) {
            const athlete = bio.athlete || {};
            const headshot = athlete.headshot?.href || `https://a.espncdn.com/i/headshots/nfl/players/full/${athlete.id}.png`;
            const position = athlete.position?.displayName || 'NFL Player';
            const team = athlete.team?.displayName || 'NFL Team';
            const jersey = athlete.jersey ? `#${athlete.jersey}` : '';
            const exp = athlete.experience?.years ? `${athlete.experience.years} Yrs Exp` : 'Veteran';

            let statsHtml = '';
            if (overview && overview.statistics && overview.statistics.splits) {
                const splits = overview.statistics.splits;
                const labels = overview.statistics.labels || [];

                statsHtml = `
                    <div class="table-container" style="margin-top:1rem;">
                        <table>
                            <thead>
                                <tr>
                                    <th>YEAR / TEAM</th>
                                    ${labels.map(l => `<th style="text-align:right;">${l}</th>`).join('')}
                                </tr>
                            </thead>
                            <tbody>
                                ${splits.map(split => `
                                    <tr>
                                        <td style="font-weight:700;">${split.displayName || 'Season'}</td>
                                        ${split.stats.map(st => `<td style="text-align:right;">${st}</td>`).join('')}
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else {
                statsHtml = `<div style="color:var(--text-muted); padding:1rem 0;">No year-by-year career statistics breakdown available for this athlete.</div>`;
            }

            modalContent.innerHTML = `
                <div class="profile-header">
                    <img class="profile-headshot" src="${headshot}" alt="${athlete.displayName}" onerror="this.src='https://a.espncdn.com/combos/i/headshots/nfl/num/1.png'">
                    <div class="profile-details">
                        <h2>${athlete.displayName}</h2>
                        <div class="profile-meta">
                            <span class="meta-tag">${team}</span>
                            <span class="meta-tag">${position} ${jersey}</span>
                            <span class="meta-tag">${exp}</span>
                        </div>
                        <div class="profile-summary-stats">
                            <div class="stat-badge">
                                <span class="label">HEIGHT</span>
                                <span class="value" style="font-size:1.1rem; color:var(--text-main);">${athlete.displayHeight || 'N/A'}</span>
                            </div>
                            <div class="stat-badge">
                                <span class="label">WEIGHT</span>
                                <span class="value" style="font-size:1.1rem; color:var(--text-main);">${athlete.displayWeight || 'N/A'}</span>
                            </div>
                            <div class="stat-badge">
                                <span class="label">AGE</span>
                                <span class="value" style="font-size:1.1rem; color:var(--text-main);">${athlete.age || 'N/A'}</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="profile-body">
                    <div class="profile-section-title">Career Statistics Breakdown</div>
                    ${statsHtml}
                </div>
            `;
        }

        function closeModal() {
            playerModal.classList.remove('active');
        }
    </script>
</body>
</html>
